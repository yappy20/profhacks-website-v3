    <!-- Remove cursor attributes -->
    <script>
      (function() {
        function removeCursorAttr() {
          const root = document.getElementById('root');
          if (root) {
            root.removeAttribute('data-cursor-element-id');
          }
        }
        
        // Remove immediately if root exists
        removeCursorAttr();
        
        // Remove on DOM ready
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', removeCursorAttr);
        } else {
          removeCursorAttr();
        }
        
        // Watch for attribute changes on root element
        setTimeout(function() {
          const root = document.getElementById('root');
          if (root) {
            const observer = new MutationObserver(function(mutations) {
              mutations.forEach(function(mutation) {
                if (mutation.type === 'attributes' && 
                    mutation.attributeName === 'data-cursor-element-id') {
                  const target = mutation.target;
                  if (target && target.hasAttribute('data-cursor-element-id')) {
                    target.removeAttribute('data-cursor-element-id');
                  }
                }
              });
            });
            
            observer.observe(root, {
              attributes: true,
              attributeFilter: ['data-cursor-element-id']
            });
          }
        }, 100);
      })();
    </script>
